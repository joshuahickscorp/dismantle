name: CI

on:
  push:
    branches: [main, "harden/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · build · test
    # Apple Silicon runner — real Metal GPU, matches the target platform.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # No `--all`: it descends into the workspace-excluded vendor/ crates (the
      # absorbed STRAND quant track), which keep their upstream formatting. Plain
      # `cargo fmt` checks the workspace members only.
      - name: Format check
        run: cargo fmt -- --check

      # Deny warnings, with external (objc cfg) and a few pedantic lints
      # allowlisted. Any NEW lint of an un-allowed kind fails the build.
      - name: Clippy
        # Deny the clippy groups that catch real defects (correctness, suspicious) plus rustc
        # warnings. The style / complexity / perf groups are advisory here: the workspace
        # carries pre-existing nits in those groups (derivable_impls, result_large_err,
        # collapsible_match, unnecessary_sort_by, ...) that are cosmetic, not bugs. This keeps
        # the meaningful gate strict without an open-ended cosmetic-lint cleanup.
        # No `--workspace`: these use the workspace `default-members`, the hawking
        # inference stack and its bake tools. HIDE is covered by the `hide` job below,
        # so nothing loses a gate -- it just stops blocking inference changes.
        run: |
          cargo clippy -- \
            -D warnings \
            -A unexpected_cfgs \
            -A unused_assignments \
            -A clippy::style \
            -A clippy::complexity \
            -A clippy::perf

      - name: Build
        run: cargo build

      # Compile every test target, including the GPU/model parity gates, so a
      # broken test can't hide behind a skip.
      - name: Compile all tests
        run: cargo test --no-run

      # Run the deterministic unit tests (no model weights or GPU required).
      # Model-dependent parity gates skip cleanly when weights are absent; the
      # independent-oracle (llama.cpp) gate runs once a small fixture is wired.
      - name: Unit tests
        run: cargo test --lib --bins

  hide:
    name: build · test (hide)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # HCLI backend/core/protocol crates are workspace members but not
      # default-members, so they get their own job instead of taxing every
      # inference change.
      - name: Clippy
        run: |
          cargo clippy -p hide-backend -p hide-fleet -- \
            -D warnings \
            -A unexpected_cfgs \
            -A unused_assignments \
            -A clippy::style \
            -A clippy::complexity \
            -A clippy::perf

      - name: Build
        run: cargo build -p hide-backend -p hide-fleet

      # `--workspace` here is deliberate: this job compiles and tests the full
      # remaining member set, Hawking and HCLI backend alike.
      - name: Compile all tests
        run: cargo test --workspace --no-run

      - name: Unit tests
        run: cargo test --workspace --lib --bins
